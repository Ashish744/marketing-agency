<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Stackly — Sign in</title>
<link rel="icon" href="assets/images/favicon.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Poppins:wght@400;500;600&family=Caveat:wght@600;700&family=Bowlby+One+SC&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/preloader.css">
<link rel="stylesheet" href="css/auth.css">
<link rel="stylesheet" href="css/signin.css">
<script src="js/main.js" defer></script>
<script src="js/auth.js" defer></script>
<script src="js/preloader.js" defer></script>
</head>
<body data-page="signin">

<div data-include="header"></div>

<main>
  <div class="art-side">
    <img src="assets/images/auth-chef-illustration.webp" alt="Illustration">
  </div>

  <div class="form-side">
    <h1 class="headline" id="headline" data-text="SIGN IN"></h1>

    <div class="field" style="animation-delay:.15s;">
      <label>Email Id</label>
      <input id="email" type="email" placeholder="you@example.com">
    </div>
    <div class="field" style="animation-delay:.28s;">
      <label for="pass">Password</label>
      <div class="password-control">
        <input id="pass" type="password" placeholder="••••••••">
        <button class="password-toggle" type="button" data-password-toggle="pass" aria-label="Show password" title="Show password" aria-pressed="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path class="eye-open" d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle class="eye-open" cx="12" cy="12" r="3"/><path class="eye-slash" d="m3 3 18 18"/></svg>
        </button>
      </div>
    </div>

    <div class="role-pick" id="rolePick" role="group" aria-label="Choose account type">
      <button type="button" class="role-btn" data-role="public"><b>Public</b><small>User dashboard</small></button>
      <button type="button" class="role-btn" data-role="admin"><b>Admin</b><small>Admin dashboard</small></button>
    </div>
    <p class="form-msg" id="formMsg" role="alert"></p>

    <div class="row-between">
      <span>Or continue with</span>
      <a href="404.html">Forgot Password?</a>
    </div>

   <button class="signin-btn" id="submitBtn" type="button">Sign In</button>
     <br>
     <button class="google-btn" type="button" onclick="window.location.href='404.html'">
      <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.6 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.8a4.1 4.1 0 0 1-1.78 2.7v2.24h2.88c1.68-1.55 2.7-3.83 2.7-6.58z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.88-2.24c-.8.54-1.83.86-3.08.86-2.37 0-4.38-1.6-5.1-3.75H.9v2.36A9 9 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.9 10.69A5.4 5.4 0 0 1 3.62 9c0-.59.1-1.16.28-1.69V4.95H.9A9 9 0 0 0 0 9c0 1.45.35 2.83.9 4.05l3-2.36z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58C13.46.9 11.42 0 9 0A9 9 0 0 0 .9 4.95l3 2.36C4.62 5.17 6.63 3.58 9 3.58z"/></svg>
      Google
    </button>

    <div class="switch-line">Don't have an account? <a href="signup.html">Sign up</a></div>


  </div>
</main>

<div data-include="footer"></div>

</body>
</html>
